<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل العملاء | ASGate CRM</title>
    <meta name="description" content="إدارة قاعدة بيانات العملاء والشركات والتصنيفات وفريق التواصل في نظام ASGate CRM.">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="shortcut icon" href="./favicon.ico">
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js",
        "chart.js/auto": "https://esm.sh/chart.js@4.4.6/auto",
        "sweetalert2": "https://esm.sh/sweetalert2@11.14.5",
        "xlsx": "https://esm.sh/xlsx@0.18.5"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        #navbarPlaceholder {
            height: 58px;
            min-height: 58px;
            max-height: 58px;
            flex-shrink: 0;
            width: 100%;
            background: #ffffff;
            display: block;
            box-sizing: border-box;
            border-bottom: 1px solid #e2e8f0;
        }
        .dashboard-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            opacity: 1 !important;
        }
        .table-wrapper { min-height: 200px; }
    </style>
    <link rel="stylesheet" href="./customers.css">
</head>
<body>

<div class="dashboard-container">
    <div id="navbarPlaceholder"></div>

    <div class="main-content">
        <div class="action-bar">
            <button class="btn-top btn-add" onclick="openAddCustomerModal()">
                <i class="fas fa-plus"></i> إضافة عميل جديد
            </button>
            
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="بحث في العملاء 🔍" onkeyup="debouncedFilterTable()">
            </div>
            
            <div class="stats-bar-visit" id="statsContainer">
                <div class="stat-total-wrapper">
                    <div class="stat-item">إجمالي العملاء: <span id="stat-total" class="stat-val">0</span></div>
                    <div class="stat-divider">|</div>
                    <div class="stat-item">عملاء الشهر: <span id="stat-month" class="stat-val">0</span></div>
                    <div class="stat-divider">|</div>
                    <div class="stat-item">عملاء اليوم: <span id="stat-today" class="stat-val">0</span></div>
                </div>
                
                <button type="button" onclick="toggleStatsVisibility()" id="eyeToggleBtn" class="eye-toggle-btn" aria-label="إخفاء / إظهار الأرقام">
                    <svg class="eye-icon eye-show-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                        <circle cx="12" cy="12" r="3.2"></circle>
                    </svg>
                </button>
            </div>

            <div class="bulk-action-wrapper">
                <button type="button" id="bulkActionBtn" class="btn-bulk-trigger" onclick="toggleDropdown(event, this)">
                    <span>إجراءات جماعية</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div id="bulkActionMenu" class="dropdown-menu">
                    <button type="button" onclick="handleBulkAction('تغيير المستخدم')"><i class="fas fa-user-edit"></i> تغيير المستخدم</button>
                    <button type="button" onclick="handleBulkAction('استيراد')"><i class="fas fa-file-import"></i> استيراد من Excel</button>
                    <button type="button" onclick="handleBulkAction('تصدير')"><i class="fas fa-file-excel"></i> تصدير إلى Excel</button>
                    <button type="button" onclick="handleBulkAction('طباعة')"><i class="fas fa-print"></i> طباعة</button>
                    <hr class="dropdown-divider">
                    <button type="button" class="del-btn" onclick="handleBulkAction('حذف المحدد')"><i class="fas fa-trash-alt"></i> حذف المحدد</button>
                </div>
                <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" style="display: none;" onchange="handleExcelUpload(event)">
            </div>
        </div>
        
        <div class="table-wrapper">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th class="col-select"><input type="checkbox" id="masterCheckbox" onclick="toggleAllCheckboxes(this)"></th>
                        <th class="col-code">كود العميل</th>
                        <th class="col-company">اسم الشركة</th>
                        <th class="col-address">المدينة</th> 
                        <th class="col-manager">اسم المسؤول</th>
                        <th class="col-mobile">رقم التواصل</th>
                        <th class="col-email">البريد الإلكتروني</th>
                        <th class="col-main-cr">السجل التجاري</th>
                        <th class="col-date">تاريخ الانشاء</th>

                        <th class="col-class">
                            <div class="custom-filter-wrapper">
                                <div class="filter-title" onclick="toggleCustomFilter(event, 'categoryFilterMenu')">
                                    تصنيف العميل <i class="fas fa-caret-down filter-arrow"></i>
                                    <span class="filter-dot" id="categoryFilterDot"></span>
                                </div>
                                <div class="multi-select-menu" id="categoryFilterMenu" onclick="event.stopPropagation()">
                                    <div style="display: flex; gap: 4px; padding: 2px 4px 6px 4px; border-bottom: 1px solid #f1f5f9; margin-bottom: 4px;">
                                        <button type="button" onclick="selectAllFilter('categoryFilterMenu')" style="flex:1; background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; border-radius:4px; padding:3px; font-size:9px; font-weight:700; cursor:pointer; font-family:Cairo;">الكل</button>
                                        <button type="button" onclick="clearAllFilter('categoryFilterMenu')" style="flex:1; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; border-radius:4px; padding:3px; font-size:9px; font-weight:700; cursor:pointer; font-family:Cairo;">تفريغ</button>
                                    </div>
                                    <div id="categoryFilterItemsContainer" style="display:flex; flex-direction:column; gap:2px;"></div>
                                </div>
                            </div>
                        </th>

                        <th class="col-notes">الملاحظات</th>

                        <th class="col-status">
                            <div class="custom-filter-wrapper">
                                <div class="filter-title" onclick="toggleCustomFilter(event, 'statusFilterMenu')">
                                    حالة العميل <i class="fas fa-caret-down filter-arrow"></i>
                                    <span class="filter-dot" id="statusFilterDot"></span>
                                </div>
                                <div class="multi-select-menu" id="statusFilterMenu" onclick="event.stopPropagation()">
                                    <div style="display: flex; gap: 4px; padding: 2px 4px 6px 4px; border-bottom: 1px solid #f1f5f9; margin-bottom: 4px;">
                                        <button type="button" onclick="selectAllFilter('statusFilterMenu')" style="flex:1; background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; border-radius:4px; padding:3px; font-size:9px; font-weight:700; cursor:pointer; font-family:Cairo;">الكل</button>
                                        <button type="button" onclick="clearAllFilter('statusFilterMenu')" style="flex:1; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; border-radius:4px; padding:3px; font-size:9px; font-weight:700; cursor:pointer; font-family:Cairo;">تفريغ</button>
                                    </div>
                                    <div id="statusFilterItemsContainer" style="display:flex; flex-direction:column; gap:2px;"></div>
                                </div>
                            </div>
                        </th>

                        <th class="col-user">
                            <div class="custom-filter-wrapper">
                                <div class="filter-title" onclick="toggleCustomFilter(event, 'ownerFilterMenu')">
                                    المستخدم <i class="fas fa-caret-down filter-arrow"></i>
                                    <span class="filter-dot" id="ownerFilterDot"></span>
                                </div>
                                <div class="multi-select-menu" id="ownerFilterMenu" onclick="event.stopPropagation()">
                                    <div style="display: flex; gap: 4px; padding: 2px 4px 6px 4px; border-bottom: 1px solid #f1f5f9; margin-bottom: 4px;">
                                        <button type="button" onclick="selectAllFilter('ownerFilterMenu')" style="flex:1; background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; border-radius:4px; padding:3px; font-size:9px; font-weight:700; cursor:pointer; font-family:Cairo;">الكل</button>
                                        <button type="button" onclick="clearAllFilter('ownerFilterMenu')" style="flex:1; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; border-radius:4px; padding:3px; font-size:9px; font-weight:700; cursor:pointer; font-family:Cairo;">تفريغ</button>
                                    </div>
                                    <div id="ownerFilterItemsContainer" style="display:flex; flex-direction:column; gap:2px;"></div>
                                </div>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- سجل النشاط -->
        <div id="activityLogSection" class="activity-log-section">
            <div class="activity-log-header-container">
                <div class="activity-log-title">
                    <i class="fas fa-history"></i> سجل نشاط العملاء
                </div>
                <button id="toggleExpandBtn" class="btn-toggle-expand" onclick="toggleLogExpansion()" aria-label="توسيع / تقليص">
                    <i class="fas fa-expand-alt"></i>
                </button>
            </div>
            <div id="activityList" class="activity-list"></div>
        </div>
    </div>
</div>

<!-- النافذة المنبثقة للملاحظات -->
<div id="noteModal" class="modal-notes" onclick="if(event.target === this) closeNote()">
    <div class="modal-notes-content">
        <div class="modal-header-title" style="font-weight: 800; color: #1e293b; font-size:14px; margin-bottom: 15px; display:flex; align-items:center; gap:8px;">
            <i class="fas fa-sticky-note" style="color:var(--accent-blue)"></i> سجل ملاحظات العميل
        </div>
        <div id="historyLog" class="history-log"></div>
        <textarea id="modalTextArea" class="note-area" placeholder="أدخل تفاصيل الملاحظة هنا..."></textarea>
        <div style="display:flex; justify-content: flex-end; gap:10px; margin-top:15px;">
            <button type="button" onclick="closeNote()" style="background:#f1f5f9; border:1px solid #cbd5e1; color:#475569; padding:8px 20px; border-radius:6px; cursor:pointer; font-family:Cairo; font-size:11.5px; font-weight:700;">إلغاء</button>
            <button type="button" onclick="saveNote()" style="background:var(--accent-blue); border:none; color:white; padding:8px 20px; border-radius:6px; cursor:pointer; font-family:Cairo; font-size:11.5px; font-weight:800; box-shadow: 0 2px 4px rgba(59,130,246,0.3);">حفظ الملاحظة</button>
        </div>
    </div>
</div>

<!-- نافذة إضافة عميل جديد -->
<div id="addCustomerModal" class="modal-notes" onclick="if(event.target === this) closeAddCustomerModal()">
    <div class="modal-add-content">
        <div class="modal-add-header">
            <i class="fas fa-user-plus"></i> إضافة عميل جديد
        </div>
        
        <div class="form-grid">
            <div class="modal-input-group">
                <label>كود العميل</label>
                <input type="text" id="addCode" readonly class="modal-input">
            </div>
            <div class="modal-input-group">
                <label>تاريخ الانشاء</label>
                <input type="text" id="addDate" readonly class="modal-input">
            </div>

            <div class="modal-input-group full-width">
                <label>اسم الشركة *</label>
                <input type="text" id="addComp" class="modal-input" placeholder="أدخل اسم الشركة...">
            </div>

            <div class="modal-input-group">
                <label>المدينة</label>
                <input type="text" id="addCity" class="modal-input" placeholder="الرياض، جدة...">
            </div>
            <div class="modal-input-group">
                <label>العنوان</label>
                <input type="text" id="addAddress" class="modal-input" placeholder="الحي، الشارع...">
            </div>

            <div class="modal-input-group full-width">
                <label>السجل التجاري</label>
                <input type="text" id="addCR" class="modal-input" placeholder="1010XXXXXX" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>

            <div class="modal-input-group">
                <label>المسؤول</label>
                <input type="text" id="addManager" class="modal-input">
            </div>
            <div class="modal-input-group">
                <label>رقم التواصل</label>
                <input type="text" id="addMob" class="modal-input" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>

            <div class="modal-input-group">
                <label>البريد الالكتروني</label>
                <input type="email" id="addEmail" class="modal-input">
            </div>
            <div class="modal-input-group">
                <label>المستخدم</label>
                <input type="text" id="addCreator" class="modal-input">
            </div>
        </div>

        <div class="modal-actions">
            <button onclick="closeAddCustomerModal()" class="btn-cancel">إلغاء</button>
            <button onclick="saveNewCustomer()" class="btn-save"><i class="fas fa-save"></i> حفظ</button>
        </div>
    </div>
</div>

<script type="module" src="./navbar.js"></script>
<script type="module" src="./customers.js"></script>
</body>
</html>
